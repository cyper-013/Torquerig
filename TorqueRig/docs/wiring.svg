<rect x="860" y="590" width="310" height="190" rx="6" fill="#f7f7f7" stroke="#888" stroke-width="1.5"/>
<text x="875" y="610" font-size="13" text-anchor="start" font-weight="bold" fill="#222">Notes</text>
<text x="875" y="630" font-size="11" text-anchor="start" font-weight="normal" fill="#222">Encoder A and B use 4.7 k&#937; pull-ups to 5 V</text>
<text x="875" y="648" font-size="11" text-anchor="start" font-weight="normal" fill="#222">(needed for open-collector encoders; check yours).</text>
<text x="875" y="666" font-size="11" text-anchor="start" font-weight="normal" fill="#222">Motor supply minus, TB6612FNG GND and Pro Micro</text>
<text x="875" y="684" font-size="11" text-anchor="start" font-weight="normal" fill="#222">GND must be joined (common ground).</text>
<text x="875" y="702" font-size="11" text-anchor="start" font-weight="normal" fill="#222">Motor 1 on AO1/AO2 and motor 2 on BO1/BO2 are</text>
<text x="875" y="720" font-size="11" text-anchor="start" font-weight="normal" fill="#222">driven together; mount or wire them to push the</text>
<text x="875" y="738" font-size="11" text-anchor="start" font-weight="normal" fill="#222">same way.</text>
<text x="875" y="756" font-size="11" text-anchor="start" font-weight="normal" fill="#222">Add a bulk capacitor across the motor supply.</text>
<text x="600" y="820" font-size="11" text-anchor="middle" font-weight="normal" fill="#222">Button numbers are as seen by the firmware. Optional: a 1N4148 diode in series with each button (anode on the row side) prevents ghosting.</text>
<text x="600" y="838" font-size="11" text-anchor="middle" font-weight="normal" fill="#222">Columns D14, D15, D16 are scanned (driven low one at a time); rows D2, D3, A3 are read with pull-ups.</text>
<text x="600" y="856" font-size="11" text-anchor="middle" font-weight="normal" fill="#222">Pro Micro pin names: D0 = RX, D1 = TX; D14, D15, D16 = MISO, SCK, MOSI.</text>
</svg>